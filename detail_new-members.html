(function() {
  function setCookie(name, value, days) {
    try {
      var expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
    } catch(e) {}
  }
  function getCookie(name) {
    try {
      var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    } catch(e) { return null; }
  }
  try {
    var p = new URLSearchParams(window.location.search);
    var fields = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','msclkid'];
    fields.forEach(function(f) {
      var val = p.get(f);
      if (val && !getCookie('sb_' + f)) {
        setCookie('sb_' + f, val, 90);
      }
    });
  } catch(e) { console.error('[SB Attribution] Error:', e); }
})();
</script>

  <script>
//payment script to create a custom checkout
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('cart-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    // 1) Recupera selección principal
    const product = document.querySelector('input[name="product"]:checked').value;
    // 2) Recupera add‑ons seleccionados
    const addons = Array.from(document.querySelectorAll('input[name="addons"]:checked'))
                        .map(chk => chk.value);
    // 3) Espera a Memberstack y extrae datos
    const ms = await MemberStack.onReady();
    if (!ms.member) {
      MemberStack.showSignup();
      return;
    }
    const memberstack_id = ms.member.id;
    const email          = ms.member.email;
    // Usa tu campo de Webflow (si lo quieres), ej:
    const webflow_user_id = '';
    // 4) Prepara payload
    const payload = { price_ids: [product, ...addons], memberstack_id, webflow_user_id, email };
    // 5) Llama a Make
    const resp = await fetch('https://hook.make.com/tu-hook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const { session_url } = await resp.json();
    // 6) Redirige al Checkout de Stripe
    window.location = session_url;
  });
});
</script>
  <script>
//dashboard Tabs script
document.addEventListener("DOMContentLoaded", () => {
  const tabs = {
    dashboard: document.querySelector('[data-tab="dashboard"]'),
    pricing: document.querySelector('[data-tab="pricing"]'),
    settings: document.querySelector('[data-tab="settings"]')
  };
  const buttons = {
    dashboard: document.querySelector('.btn-dashboard'),
    pricing: document.querySelector('.btn-pricing'),
    settings: document.querySelector('.btn-settings')
  };
  function showTab(tab) {
    // Oculta secciones
    Object.values(tabs).forEach(section => {
      section.style.display = "none";
      section.classList.remove("active");
    });
    // Muestra sección activa
    tabs[tab].style.display = "block";
    setTimeout(() => tabs[tab].classList.add("active"), 10);
    // Quita clase activa de todos los botones
    Object.values(buttons).forEach(btn => btn.classList.remove("active"));
    // Activa el botón actual
    buttons[tab].classList.add("active");
  }
  // Eventos click
  buttons.dashboard.addEventListener('click', () => showTab('dashboard'));
  buttons.pricing.addEventListener('click', () => showTab('pricing'));
  buttons.settings.addEventListener('click', () => showTab('settings'));
  // Carga inicial
  showTab('dashboard');
});
</script>

  <script>
//ad internal page Script
(() => {
  // Soporta ambas clases de panel
  const PANEL_SEL = '.Internaladpage, .Internal-ad-page';
  const OPEN_BTN_SEL = '.open-internal';
  const CLOSE_BTN_SEL = '.internal-close-btn';
  // Devuelve el wrapper del CMS item
  function findItemRoot(el){
    return el.closest('.w-dyn-item') 
        || el.closest('.collection-item')
        || el.closest('.Collection\\ Item')
        || el.closest('[data-cms-item]')  // por si usas un atributo propio
        || el.closest('*');
  }
  function openPanel(panel){
    panel.style.display = 'block';          // usa 'flex' si tu diseño lo requiere
    document.documentElement.style.overflow = 'hidden';
  }
  function closePanel(panel){
    panel.style.display = 'none';
    document.documentElement.style.overflow = '';
  }
  function hideAllPanels(){
    document.querySelectorAll(PANEL_SEL).forEach(p => p.style.display = 'none');
  }
  // Delegación de clicks
  document.addEventListener('click', (e) => {
    // ABRIR
    const openBtn = e.target.closest(OPEN_BTN_SEL);
    if (openBtn){
      e.preventDefault();
      const item = findItemRoot(openBtn);
      const panel = item ? item.querySelector(PANEL_SEL) : null;
      if (!panel){
        console.warn('⚠️ No se encontró el panel (.Internaladpage / .Internal-ad-page) dentro del mismo Collection Item del botón:', openBtn);
        console.log('Item encontrado:', item);
        return;
      }
      hideAllPanels();
      openPanel(panel);
      return;
    }
    // CERRAR con botón
    const closeBtn = e.target.closest(CLOSE_BTN_SEL);
    if (closeBtn){
      e.preventDefault();
      const panel = closeBtn.closest(PANEL_SEL);
      if (panel) closePanel(panel);
      return;
    }
    // CERRAR clic en overlay (si haces clic en el overlay mismo)
    const overlay = e.target.closest(PANEL_SEL);
    if (overlay && e.target === overlay){
      closePanel(overlay);
    }
  });
  // Cerrar todos con ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideAllPanels();
  });
  // Debug opcional
  console.log('[debug] Nº de panels encontrados:', document.querySelectorAll(PANEL_SEL).length);
  console.log('[debug] Nº de botones open-internal:', document.querySelectorAll(OPEN_BTN_SEL).length);
})();
</script>
  <script>
(() => {
  const PANEL_SEL     = '.internaladpage';
  const OPEN_BTN_SEL  = '.open-internal';
  const CLOSE_BTN_SEL = '.internal-close-btn';
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const $  = (sel, root=document) => root.querySelector(sel);
  function show(p){ if(!p) return; p.style.display='block'; document.documentElement.style.overflow='hidden'; }
  function hide(p){ if(!p) return; p.style.display='none';  document.documentElement.style.overflow=''; }
  function hideAll(){ $$(PANEL_SEL).forEach(hide); }
  function findPanelFromButton(btn){
    const target = (btn.dataset.target || '').trim();
    if (target){
      // 1) data-panel-id = AdId
      let p = document.querySelector(`${PANEL_SEL}[data-panel-id="${target}"]`);
      if (p) return p;
      // 2) fallback: data-ad-id = AdId (si lo usas)
      p = document.querySelector(`${PANEL_SEL}[data-ad-id="${target}"]`);
      if (p) return p;
    }
    // 3) último recurso: buscar dentro del mismo item
    const item = btn.closest('.w-dyn-item, .collection-item, .Collection\\ Item') || btn.closest('*');
    return $(PANEL_SEL, item);
  }
  document.addEventListener('click', (e) => {
    // Abrir
    const openBtn = e.target.closest(OPEN_BTN_SEL);
    if (openBtn){
      e.preventDefault();
      const panel = findPanelFromButton(openBtn);
      if (!panel) return console.warn('No panel .internaladpage coincide con:', openBtn.dataset.target);
      hideAll();
      show(panel);
      return;
    }
    // Cerrar con botón
    const closeBtn = e.target.closest(CLOSE_BTN_SEL);
    if (closeBtn){
      e.preventDefault();
      hide(closeBtn.closest(PANEL_SEL));
      return;
    }
    // Cerrar clic en overlay
    const overlay = e.target.closest(PANEL_SEL);
    if (overlay && e.target === overlay) hide(overlay);
  });
  // Cerrar todos con ESC
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideAll(); });
})();
</script>
  <script>
//form script
  let currentStep = 1;
  const totalSteps = document.querySelectorAll('[data-step]').length;
  function showStep(step) {
    document.querySelectorAll('[data-step]').forEach(el => {
      el.style.display = el.getAttribute('data-step') == step ? 'flex' : 'none';
    });
    const dots = document.querySelectorAll('.progress-dot');
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === step - 1);
    });
    const counter = document.querySelector('.progress-counter');
    if (counter) {
      counter.textContent = `${step} of ${totalSteps}`;
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    showStep(currentStep);
    document.querySelectorAll('.nextbuttonform.next-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        if (currentStep < totalSteps) {
          currentStep++;
          showStep(currentStep);
        }
      })
    );
    document.querySelectorAll('.clearbuttonform.previusforrmbutton').forEach(btn =>
      btn.addEventListener('click', () => {
        if (currentStep > 1) {
          currentStep--;
          showStep(currentStep);
        }
      })
    );
    document.querySelectorAll('.progress-dot').forEach((dot, index) => {
      dot.addEventListener('click', () => {
        currentStep = index + 1;
        showStep(currentStep);
      });
    });
    // Ocultar la barra de progreso con delay después del submit
    const submitBtn = document.querySelector('.nextbuttonform.submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        setTimeout(() => {
          const progressBar = document.querySelector('.progress-bar-form');
          if (progressBar) {
            progressBar.style.display = 'none';
          }
        }, 500); // 1000 milisegundos = 1 segundos
      });
    }
  });
</script>
  <script>
(async () => {
  const GET_NOTIFS_URL = "https://hook.us2.make.com/pb31sprjww2waikgvkkiudddx5g9mwvo"; // <-- tu URL
  // Memberstack v1
  if (!window.$memberstackDom) return;
  const r = await window.$memberstackDom.getCurrentMember().catch(()=>null);
  const member = r?.data?.member || r?.data;
  if (!member) return;
  const memberId = member.id;
  const fixTs = v => Number(String(v).replace(/["\\]/g, "")); // quita comillas escapadas
  try {
    const res = await fetch(GET_NOTIFS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ memberId })
    });
    const data = await res.json(); // { notifications: [ {data:{...}}, ... ] }
    // Desenvuelve cada item.data
    const list = Array.isArray(data?.notifications)
      ? data.notifications.map(it => it?.data || it)
      : [];
    const el = document.getElementById("notifications-container");
    if (!el) return;
    if (!list.length) {
      el.innerHTML = "<p>No tienes notificaciones</p>";
      return;
    }
    el.innerHTML = list.map(n => {
      const msg = n.message || n.status || n["Your project is Now on"] || "(sin mensaje)";
      const proj = n.projectName || n.Name || "";
      const when = new Date(fixTs(n.createdAt || Date.now())).toLocaleString();
      const unread = n.read ? "" : " style='background:#eef4ff;font-weight:600;'";
      return `
        <div class="notif-item"${unread}>
          <div class="notif-message">${msg}</div>
          <div class="notif-meta" style="font-size:12px;color:#666;margin-top:4px;">
            ${proj} · ${when}
          </div>
        </div>
      `;
    }).join("");
  } catch (e) {
    console.error("[notif] error", e);
    document.getElementById("notifications-container").innerHTML =
      "<p>Error cargando notificaciones</p>";
  }
})();
</script>

}
/* Texto de los botones */
.btn-label {
  color: #4B5563 !important; /* Gris oscuro */
  font-weight: 500 !important;
  transition: color 0.3s ease;
}
/* Icono base (todos usan la misma clase) */
.IconNavDashboard {
  filter: grayscale(100%) brightness(0.7);
  transition: filter 0.3s ease;
}
/* Estilos para botón activo */
.btn-dashboard.active,
.btn-pricing.active,
.btn-settings.active {
  background-color: #7375EC;
  border-radius: 25px;
}
.btn-dashboard.active .btn-label,
.btn-pricing.active .btn-label,
.btn-settings.active .btn-label {
  color: #ffffff !important;
  font-weight: 600 !important;
}
.btn-dashboard.active .IconNavDashboard,
.btn-pricing.active .IconNavDashboard,
.btn-settings.active .IconNavDashboard {
  filter: brightness(200%) grayscale(0);
}
</style>
  <style>
[data-tab] {
  opacity: 0;
  transition: opacity 0.4s ease;
}
[data-tab].active {
  opacity: 1;
}
/* que las slides estiren en altura con su contenido */
.ads-swiper-list .swiper-wrapper { align-items: stretch; }
.ads-swiper-list .swiper-slide   { height: auto; }
/* flechas básicas creadas por el script */
.ads-swiper-prev, .ads-swiper-next {
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  background: rgba(0,0,0,.4);
  color: #fff;
  border: 0;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  cursor: pointer;
}
.ads-swiper-prev { left: 8px;  }
.ads-swiper-next { right: 8px; }
/* que nada se recorte si tus tarjetas tienen sombras, overlays, etc. */
.ads-swiper-list, .ads-swiper-list .swiper-wrapper { overflow: visible; }
</style>
